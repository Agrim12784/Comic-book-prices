[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comicprice"
version = "0.1.0"
description = "Fetch and normalize comic book prices, including variants, collectibles and limited editions"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sqlalchemy>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
comicprice = "comicprice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=comicprice --cov-report=term-missing"

[tool.ruff]
line-length = 100
